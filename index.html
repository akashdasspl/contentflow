<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContentFlow AI - Smart Content Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 40px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      color: #667eea;
      font-size: 2.5em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 1.1em;
    }

    .form-group {
      margin-bottom: 25px;
      animation: fadeIn 0.6s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 0.95em;
    }

    input, select, textarea {
      width: 100%;
      padding: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      background: white;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      transform: translateY(-2px);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .output-section {
      margin-top: 30px;
      padding: 25px;
      background: #f8f9fa;
      border-radius: 15px;
      border: 2px solid #e0e0e0;
      min-height: 200px;
      animation: fadeIn 0.5s ease-out;
    }

    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .output-title {
      font-weight: bold;
      color: #333;
      font-size: 1.2em;
    }

    .copy-btn {
      padding: 8px 16px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      width: auto;
      margin: 0;
    }

    .copy-btn:hover {
      background: #5568d3;
    }

    #output {
      white-space: pre-wrap;
      line-height: 1.8;
      color: #333;
      font-size: 15px;
    }

    .loading {
      text-align: center;
      color: #667eea;
      font-size: 1.1em;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
    }

    .stat-item {
      flex: 1;
      text-align: center;
      padding: 10px;
      background: white;
      border-radius: 8px;
    }

    .stat-value {
      font-size: 1.5em;
      font-weight: bold;
      color: #667eea;
    }

    .stat-label {
      font-size: 0.85em;
      color: #666;
      margin-top: 5px;
    }

    .platform-icon {
      margin-right: 8px;
    }

    @media (max-width: 768px) {
      .row {
        grid-template-columns: 1fr;
      }
      
      .container {
        padding: 25px;
      }
      
      h1 {
        font-size: 2em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 ContentFlow AI</h1>
    <p class="subtitle">Transform your ideas into engaging content</p>

    <div class="form-group">
      <label for="idea">💡 Your Content Idea</label>
      <textarea 
        id="idea" 
        placeholder="e.g., AI in healthcare, sustainable fashion, productivity tips..."
        maxlength="500"
      ></textarea>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="platform">📱 Platform</label>
        <select id="platform">
          <option value="linkedin">💼 LinkedIn</option>
          <option value="twitter">🐦 Twitter / X</option>
          <option value="instagram">📸 Instagram</option>
          <option value="facebook">👥 Facebook</option>
          <option value="youtube">🎥 YouTube</option>
          <option value="tiktok">🎵 TikTok</option>
          <option value="blog">📝 Blog Post</option>
        </select>
      </div>

      <div class="form-group">
        <label for="intent">🎯 Content Type</label>
        <select id="intent">
          <option value="promotional">Promotional</option>
          <option value="educational">Educational</option>
        </select>
      </div>
    </div>

    <button onclick="generate()" id="generateBtn">
      ✨ Generate Content
    </button>

    <div class="output-section" id="outputSection" style="display: none;">
      <div class="output-header">
        <span class="output-title">📝 Generated Content</span>
        <button class="copy-btn" onclick="copyToClipboard()">📋 Copy</button>
      </div>
      <div id="output"></div>
      <div class="stats" id="stats" style="display: none;">
        <div class="stat-item">
          <div class="stat-value" id="wordCount">0</div>
          <div class="stat-label">Words</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="charCount">0</div>
          <div class="stat-label">Characters</div>
        </div>
        <div class="stat-item">
          <div class="stat-value" id="hashtagCount">0</div>
          <div class="stat-label">Hashtags</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let generatedContent = '';

    async function generate() {
      const idea = document.getElementById("idea").value.trim();
      const platform = document.getElementById("platform").value;
      const intent = document.getElementById("intent").value;
      const btn = document.getElementById("generateBtn");
      const outputSection = document.getElementById("outputSection");
      const output = document.getElementById("output");
      const stats = document.getElementById("stats");

      if (!idea) {
        alert("Please enter a content idea!");
        return;
      }

      // Show loading state
      btn.disabled = true;
      btn.textContent = "⏳ Generating...";
      outputSection.style.display = "block";
      output.innerHTML = '<div class="loading"><div class="spinner"></div>Crafting your content...</div>';
      stats.style.display = "none";

      try {
        const res = await fetch("http://localhost:3000/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            userId: "test-user",
            contentIdea: idea,
            platform: platform,
            intent: intent
          })
        });

        const data = await res.json();

        if (data.success) {
          generatedContent = data.data.content;
          output.textContent = generatedContent;
          
          // Update stats
          const words = generatedContent.split(/\s+/).length;
          const chars = generatedContent.length;
          const hashtags = (generatedContent.match(/#/g) || []).length;
          
          document.getElementById("wordCount").textContent = words;
          document.getElementById("charCount").textContent = chars;
          document.getElementById("hashtagCount").textContent = hashtags;
          stats.style.display = "flex";
        } else {
          output.textContent = "❌ Error: " + (data.error || "Failed to generate content");
        }
      } catch (err) {
        output.textContent = "❌ Error: " + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "✨ Generate Content";
      }
    }

    function copyToClipboard() {
      if (!generatedContent) return;
      
      navigator.clipboard.writeText(generatedContent).then(() => {
        const btn = event.target;
        const originalText = btn.textContent;
        btn.textContent = "✅ Copied!";
        setTimeout(() => {
          btn.textContent = originalText;
        }, 2000);
      }).catch(err => {
        alert("Failed to copy: " + err.message);
      });
    }

    // Allow Enter key to submit (with Shift+Enter for new line in textarea)
    document.getElementById("idea").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        generate();
      }
    });
  </script>
</body>
</html>
